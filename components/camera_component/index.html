<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e1117; }
  #display {
    width: 100%;
    display: block;
    border-radius: 6px;
    background: #1a1a2e;
  }
  #status {
    color: #aaa;
    font-family: sans-serif;
    font-size: 12px;
    text-align: center;
    padding: 6px;
    background: #0e1117;
  }
  #error-box {
    color: #ff6b6b;
    font-family: sans-serif;
    font-size: 14px;
    padding: 20px;
    text-align: center;
    display: none;
    background: #1a0a0a;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <canvas id="display"></canvas>
  <div id="status">⏳ Starting camera...</div>
  <div id="error-box"></div>

<script>
  // ── Streamlit component protocol (raw postMessage) ─────────────────────
  function sendValue(val) {
    window.parent.postMessage({ type: 'streamlit:setComponentValue', value: val }, '*');
  }
  function setHeight(h) {
    window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: h }, '*');
  }

  // Signal Streamlit we are ready
  window.parent.postMessage({ type: 'streamlit:componentReady', apiVersion: 1 }, '*');
  setHeight(380);

  // ── DOM refs ───────────────────────────────────────────────────────────
  const canvas    = document.getElementById('display');
  const ctx       = canvas.getContext('2d');
  const statusEl  = document.getElementById('status');
  const errorBox  = document.getElementById('error-box');

  // ── State ──────────────────────────────────────────────────────────────
  let video        = null;
  let annotatedImg = null;
  let showAnnotated = false;

  // ── Receive annotated frames FROM Python ───────────────────────────────
  window.addEventListener('message', function (e) {
    const data = e.data;
    if (!data || data.type !== 'streamlit:render') return;
    const b64 = data.args && data.args.annotated;
    if (b64 && b64.length > 50) {
      const img = new Image();
      img.onload = function () {
        annotatedImg  = img;
        showAnnotated = true;
        // Flip back to live feed after a short window so user stays
        clearTimeout(window._annTimer);
        window._annTimer = setTimeout(function () {
          showAnnotated = false;
        }, 450);
      };
      img.src = b64;
    }
  });

  // ── Render loop — draws live feed OR latest annotated frame ───────────
  function renderLoop() {
    if (showAnnotated && annotatedImg) {
      canvas.width  = annotatedImg.naturalWidth;
      canvas.height = annotatedImg.naturalHeight;
      ctx.drawImage(annotatedImg, 0, 0);
    } else if (video && video.readyState >= 2) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(renderLoop);
  }

  // ── Send frames to Python at ~2 FPS ───────────────────────────────────
  var INTERVAL_MS = 500;
  var lastSent    = 0;

  function maybeSendFrame() {
    var now = Date.now();
    if (now - lastSent < INTERVAL_MS) return;
    if (!video || video.readyState < 2)  return;
    lastSent = now;

    var tmp = document.createElement('canvas');
    tmp.width  = video.videoWidth  || 640;
    tmp.height = video.videoHeight || 480;
    tmp.getContext('2d').drawImage(video, 0, 0);
    var dataUrl = tmp.toDataURL('image/jpeg', 0.65);
    sendValue(dataUrl);
  }

  // ── Open webcam ────────────────────────────────────────────────────────
  navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false
  })
  .then(function (stream) {
    video           = document.createElement('video');
    video.srcObject = stream;
    video.autoplay  = true;
    video.playsInline = true;
    video.muted     = true;

    video.onloadedmetadata = function () {
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
      setHeight(canvas.height + 30);
      statusEl.textContent = '🟢 Pose detection active';
      renderLoop();
      setInterval(maybeSendFrame, 100);
    };
  })
  .catch(function (err) {
    errorBox.style.display = 'block';
    errorBox.innerHTML = '⚠️ Camera access failed:<br><small>' +
                         (err.message || String(err)) + '</small><br><br>' +
                         'Please allow camera permission and reload.';
    statusEl.textContent = '';
    setHeight(120);
    sendValue(null);
  });
</script>
</body>
</html>
